name: Publish extension to marketplaces

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-version:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Match tag to package version
        run: |
          expected_tag="v$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "error: release tag $GITHUB_REF_NAME does not match package.json version $expected_tag" >&2
            exit 1
          fi

  extension-tests:
    name: Stable tests / Ubuntu
    needs: validate-version
    uses: ./.github/workflows/extension-tests.yml
    with:
      runner: ubuntu-latest
      slang-asset: slang-linux-x86_64.tar.gz
      slang-sha256: 951a170e10e25e54c91565030acfdfc11c3226714ebf225a18ad4166a898d8a4
      required-native-tools: slang,iverilog,verilator
      code-version: stable
      run-native: true

  wasm-build:
    name: Bundled WASM
    needs: validate-version
    uses: ./.github/workflows/build-slang-server-wasm.yml

  package:
    name: Test and package release VSIX
    needs: [extension-tests, wasm-build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Download WASM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: slang-server-wasm
          path: resources/wasm

      - name: Verify bundled slang-server WASM
        run: npm run verify:wasm-bundle

      - name: Build extension tests
        run: npm run test:build

      - name: Test bundled slang-server WASM indexing
        run: xvfb-run -a npm run test:slang-wasm-indexing:run -- --code-version stable

      - name: Package VSIX
        run: npm run package

      - name: Verify VSIX contents
        run: npm run verify:vsix -- veriloghdl-*.vsix

      - name: Prepare VSIX artifact
        run: |
          mkdir -p dist-vsix
          mv veriloghdl-*.vsix dist-vsix/veriloghdl.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: veriloghdl-vsix
          path: dist-vsix/veriloghdl.vsix
          if-no-files-found: error
          retention-days: 14

  publish-open-vsx:
    name: Publish to Open VSX Registry
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: veriloghdl-vsix
          path: dist-vsix

      - name: Publish to Open VSX Registry
        uses: HaaLeo/publish-vscode-extension@ca5561daa085dee804bf9f37fe0165785a9b14db # v2.0.0
        with:
          pat: ${{ secrets.OPEN_VSX_TOKEN }}
          extensionFile: dist-vsix/veriloghdl.vsix

  publish-vscode-marketplace:
    name: Publish to Visual Studio Marketplace
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: veriloghdl-vsix
          path: dist-vsix

      - name: Publish to Visual Studio Marketplace
        uses: HaaLeo/publish-vscode-extension@ca5561daa085dee804bf9f37fe0165785a9b14db # v2.0.0
        with:
          pat: ${{ secrets.VS_MARKETPLACE_TOKEN }}
          extensionFile: dist-vsix/veriloghdl.vsix
          registryUrl: https://marketplace.visualstudio.com
