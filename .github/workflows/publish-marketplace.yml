on:
  push:
    tags:
      - "*"

name: Publish extension to marketplace

jobs:
  package:
    name: Test and package extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - run: npm ci
      - name: Install dependencies
        run: |
          # Language server smoke tests keep servers disabled and need no binaries.
          sudo apt update
          sudo apt install -y iverilog verilator
      - run: xvfb-run -a npm test
      - run: npm run package
      - run: npm run verify:vsix -- veriloghdl-*.vsix
      - name: Prepare VSIX artifact
        run: |
          mkdir -p dist-vsix
          mv veriloghdl-*.vsix dist-vsix/veriloghdl.vsix
      - name: Upload VSIX package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-vsix
          path: dist-vsix/veriloghdl.vsix

  publish-open-vsx:
    name: Publish to Open VSX Registry
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download VSIX package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-vsix
          path: dist-vsix
      - name: Publish to Open VSX Registry
        uses: HaaLeo/publish-vscode-extension@ca5561daa085dee804bf9f37fe0165785a9b14db # v2.0.0
        with:
          pat: ${{ secrets.OPEN_VSX_TOKEN }}
          extensionFile: dist-vsix/veriloghdl.vsix

  publish-vscode-marketplace:
    name: Publish to Visual Studio Marketplace
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download VSIX package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-vsix
          path: dist-vsix
      - name: Publish to Visual Studio Marketplace
        uses: HaaLeo/publish-vscode-extension@ca5561daa085dee804bf9f37fe0165785a9b14db # v2.0.0
        with:
          pat: ${{ secrets.VS_MARKETPLACE_TOKEN }}
          extensionFile: dist-vsix/veriloghdl.vsix
          registryUrl: https://marketplace.visualstudio.com
