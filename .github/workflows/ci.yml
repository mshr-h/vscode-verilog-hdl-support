name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Check types
        run: npm run check-types

      - name: Lint
        run: npm run lint

      - name: Bundle extension
        run: npm run build:extension

      - name: Verify generated SystemVerilog grammar
        run: |
          npm run syntax
          git diff --exit-code -- syntaxes/systemverilog.tmLanguage.json

  tests:
    name: Stable / ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            slang-asset: slang-macos-arm64.tar.gz
            slang-sha256: 6d2f86ffedfefe663c6f55fd77348806faafccd69e71f7359986b0c9604f9187
            required-native-tools: slang,iverilog,verilator,verible-verilog-format,verible-verilog-lint
          - runner: ubuntu-latest
            slang-asset: slang-linux-x86_64.tar.gz
            slang-sha256: 951a170e10e25e54c91565030acfdfc11c3226714ebf225a18ad4166a898d8a4
            required-native-tools: slang,iverilog,verilator
          - runner: windows-latest
            slang-asset: slang-windows-x86_64.zip
            slang-sha256: 23d0a3d052cf88da13acc8b73161d77e3242ffbc630bb0577a3ccda0e4e39d81
            required-native-tools: slang
    uses: ./.github/workflows/extension-tests.yml
    with:
      runner: ${{ matrix.runner }}
      slang-asset: ${{ matrix.slang-asset }}
      slang-sha256: ${{ matrix.slang-sha256 }}
      required-native-tools: ${{ matrix.required-native-tools }}
      code-version: stable
      run-native: true

  minimum-vscode:
    name: Minimum VS Code / Ubuntu
    uses: ./.github/workflows/extension-tests.yml
    with:
      runner: ubuntu-latest
      slang-asset: slang-linux-x86_64.tar.gz
      slang-sha256: 951a170e10e25e54c91565030acfdfc11c3226714ebf225a18ad4166a898d8a4
      code-version: 1.107.0
      run-native: false

  wasm-build:
    name: Bundled WASM
    uses: ./.github/workflows/build-slang-server-wasm.yml

  wasm-package:
    name: Test and package bundled WASM
    needs: wasm-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Download WASM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: slang-server-wasm
          path: resources/wasm

      - name: Verify bundled slang-server WASM
        run: npm run verify:wasm-bundle

      - name: Build extension tests
        run: npm run test:build

      - name: Test bundled slang-server WASM indexing
        run: xvfb-run -a npm run test:slang-wasm-indexing:run -- --code-version stable

      - name: Package VSIX with bundled WASM
        run: npm run package

      - name: Verify VSIX contents
        run: npm run verify:vsix -- veriloghdl-*.vsix

      - name: Prepare VSIX artifact
        run: |
          mkdir -p dist-vsix
          mv veriloghdl-*.vsix dist-vsix/veriloghdl.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: veriloghdl-vsix
          path: dist-vsix/veriloghdl.vsix
          if-no-files-found: error
          retention-days: 14

  windows-wsl2:
    name: Windows WSL2 integration
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Setup WSL2
        uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7.0.0
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          update: 'true'
          additional-packages: verilator

      - name: Verify WSL2 toolchain
        shell: pwsh
        run: |
          wsl --status
          wsl --list --verbose
          wsl -e bash -lc 'set -euxo pipefail; uname -a; command -v wslpath; command -v verilator; verilator --version'

      - name: Build extension tests
        run: npm run test:build

      - name: Run WSL2 integration tests
        env:
          VERILOGHDL_RUN_WSL2_TESTS: '1'
        run: npm run test:windows-wsl2:run -- --code-version stable
