name: Build bundled slang-server WASM

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slang-wasm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify slang-server WASM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Restore bundled WASM
        id: wasm-cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: |
            resources/wasm/slang-server.wasm
            resources/wasm/slang-server.meta.json
          key: ${{ runner.os }}-${{ runner.arch }}-slang-server-wasm-${{ hashFiles('build/slang-server.lock.json', 'scripts/build-slang-server-wasm.sh', 'scripts/patch-slang-server-wasi.mjs', 'resources/wasm/licenses/*') }}

      - name: Restore WASM build inputs
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: |
            .cache/slang-server-wasm/source
            .cache/slang-server-wasm/downloads
            .cache/slang-server-wasm/tools
          key: ${{ runner.os }}-${{ runner.arch }}-slang-server-wasm-inputs-${{ hashFiles('build/slang-server.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-slang-server-wasm-inputs-

      - name: Install WASM build tools
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Build bundled slang-server WASM
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: npm run build:slang-wasm

      - name: Verify tracked WASM licenses
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: git diff --exit-code -- resources/wasm/licenses

      - name: Verify bundled slang-server WASM
        run: npm run verify:wasm-bundle

      - name: Report artifact
        run: |
          size="$(wc -c < resources/wasm/slang-server.wasm | tr -d ' ')"
          sha="$(sha256sum resources/wasm/slang-server.wasm | awk '{print $1}')"
          {
            echo "## slang-server.wasm"
            echo ""
            echo "- cache hit: ${{ steps.wasm-cache.outputs.cache-hit }}"
            echo "- size: ${size} bytes"
            echo "- sha256: ${sha}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload WASM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slang-server-wasm
          path: |
            resources/wasm/slang-server.wasm
            resources/wasm/slang-server.meta.json
            resources/wasm/licenses/*
          if-no-files-found: error
          retention-days: 14
