name: Extension tests

on:
  workflow_call:
    inputs:
      runner:
        description: GitHub-hosted runner label
        required: true
        type: string
      slang-asset:
        description: Slang release archive for the runner
        required: true
        type: string
      slang-sha256:
        description: SHA-256 digest of the Slang release archive
        required: true
        type: string
      required-native-tools:
        description: Comma-separated executable names that must be available
        required: false
        default: ''
        type: string
      code-version:
        description: VS Code version passed to vscode-test
        required: false
        default: stable
        type: string
      run-native:
        description: Run tests that invoke installed native HDL tools
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  test:
    name: ${{ inputs.runner }} / VS Code ${{ inputs.code-version }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    env:
      SLANG_VERSION: v11.0
      VERIBLE_VERSION: v0.0-4071-g8d9f2c97
      VERIBLE_SHA256: bfa43258d9132797ec9dca2a624395bb83967e18b888803c022d1c9a889203b6
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Cache Slang
        id: cache-slang
        if: inputs.run-native
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: ~/.cache/veriloghdl-tools/slang/${{ env.SLANG_VERSION }}/${{ inputs.slang-asset }}
          key: ${{ runner.os }}-${{ runner.arch }}-slang-${{ env.SLANG_VERSION }}-${{ inputs.slang-asset }}-${{ inputs.slang-sha256 }}

      - name: Install Slang (Unix)
        if: inputs.run-native && runner.os != 'Windows' && steps.cache-slang.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          install_dir="$HOME/.cache/veriloghdl-tools/slang/${SLANG_VERSION}/${{ inputs.slang-asset }}"
          archive="$RUNNER_TEMP/${{ inputs.slang-asset }}"
          curl -fsSL --retry 3 --retry-delay 5 \
            -o "$archive" \
            "https://github.com/MikePopoloski/slang/releases/download/${SLANG_VERSION}/${{ inputs.slang-asset }}"
          echo "${{ inputs.slang-sha256 }}  ${archive}" | shasum -a 256 --check -
          rm -rf "$install_dir"
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir"
          chmod +x "$install_dir/slang"

      - name: Install Slang (Windows)
        if: inputs.run-native && runner.os == 'Windows' && steps.cache-slang.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $installDir = Join-Path $env:USERPROFILE ".cache/veriloghdl-tools/slang/$env:SLANG_VERSION/${{ inputs.slang-asset }}"
          $archive = Join-Path $env:RUNNER_TEMP "${{ inputs.slang-asset }}"
          curl.exe -fsSL --retry 3 --retry-delay 5 `
            -o $archive `
            "https://github.com/MikePopoloski/slang/releases/download/$env:SLANG_VERSION/${{ inputs.slang-asset }}"
          $actualHash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actualHash -ne "${{ inputs.slang-sha256 }}") {
            throw "Slang archive hash mismatch: expected ${{ inputs.slang-sha256 }}, got $actualHash"
          }
          if (Test-Path $installDir) {
            Remove-Item -Recurse -Force $installDir
          }
          New-Item -ItemType Directory -Force $installDir | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $installDir

      - name: Add Slang to PATH (Unix)
        if: inputs.run-native && runner.os != 'Windows'
        run: echo "$HOME/.cache/veriloghdl-tools/slang/${SLANG_VERSION}/${{ inputs.slang-asset }}" >> "$GITHUB_PATH"

      - name: Add Slang to PATH (Windows)
        if: inputs.run-native && runner.os == 'Windows'
        shell: pwsh
        run: |
          $installDir = Join-Path $env:USERPROFILE ".cache/veriloghdl-tools/slang/$env:SLANG_VERSION/${{ inputs.slang-asset }}"
          $installDir | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Cache Verible (macOS)
        id: cache-verible
        if: inputs.run-native && runner.os == 'macOS'
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: ~/.cache/veriloghdl-tools/verible/${{ env.VERIBLE_VERSION }}
          key: ${{ runner.os }}-${{ runner.arch }}-verible-${{ env.VERIBLE_VERSION }}-${{ env.VERIBLE_SHA256 }}

      - name: Install Verible (macOS)
        if: inputs.run-native && runner.os == 'macOS' && steps.cache-verible.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          install_dir="$HOME/.cache/veriloghdl-tools/verible/${VERIBLE_VERSION}"
          archive="$RUNNER_TEMP/verible-${VERIBLE_VERSION}-macOS.tar.gz"
          extract_dir="$RUNNER_TEMP/verible-${VERIBLE_VERSION}"
          curl -fsSL --retry 3 --retry-delay 5 \
            -o "$archive" \
            "https://github.com/chipsalliance/verible/releases/download/${VERIBLE_VERSION}/verible-${VERIBLE_VERSION}-macOS.tar.gz"
          echo "${VERIBLE_SHA256}  ${archive}" | shasum -a 256 --check -
          rm -rf "$install_dir" "$extract_dir"
          mkdir -p "$(dirname "$install_dir")" "$extract_dir"
          tar -xzf "$archive" -C "$extract_dir"
          mv "$extract_dir/verible-${VERIBLE_VERSION}-macOS" "$install_dir"

      - name: Add Verible to PATH (macOS)
        if: inputs.run-native && runner.os == 'macOS'
        run: echo "$HOME/.cache/veriloghdl-tools/verible/${VERIBLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Install native tools (macOS)
        if: runner.os == 'macOS' && inputs.run-native
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: '1'
        run: brew install icarus-verilog verilator

      - name: Install native tools (Ubuntu)
        if: runner.os == 'Linux' && inputs.run-native
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator

      - name: Verify Slang
        if: inputs.run-native
        run: slang --version

      - name: Verify native tools (macOS)
        if: runner.os == 'macOS' && inputs.run-native
        run: |
          iverilog -V
          verilator --version
          verible-verilog-format --version
          verible-verilog-lint --version

      - name: Verify native tools (Ubuntu)
        if: runner.os == 'Linux' && inputs.run-native
        run: |
          iverilog -V
          verilator --version

      - name: Build extension tests
        run: npm run test:build

      - name: Run core tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:core:run -- --code-version "${{ inputs.code-version }}"

      - name: Run core tests
        if: runner.os != 'Linux'
        run: npm run test:core:run -- --code-version "${{ inputs.code-version }}"

      - name: Run native tool tests (Linux)
        if: runner.os == 'Linux' && inputs.run-native
        env:
          VERILOGHDL_REQUIRED_NATIVE_TOOLS: ${{ inputs.required-native-tools }}
        run: xvfb-run -a npm run test:native:run -- --code-version "${{ inputs.code-version }}"

      - name: Run native tool tests
        if: runner.os != 'Linux' && inputs.run-native
        env:
          VERILOGHDL_REQUIRED_NATIVE_TOOLS: ${{ inputs.required-native-tools }}
        run: npm run test:native:run -- --code-version "${{ inputs.code-version }}"
